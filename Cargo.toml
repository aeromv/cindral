[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/cindral-core",
    "crates/cindral-protocol",
    "crates/cindral-world",
    "crates/cindral-model",
    "crates/cindral-mesh",
    "crates/cindral-render",
    "crates/cindral-client",
    "crates/cindral-net",
    "crates/cindral-testkit",
    "crates/cindral-assets",
    "crates/cindral-game",
    "crates/cindral-ui",
    "crates/cindral-audio",
    "crates/cindral-auth",
    "crates/cindral-builtin-mods",
    "crates/cindral-packext",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
authors = ["Cindral contributors"]
repository = "https://github.com/aeromv/cindral"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes = "0.9"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.0"
fontdue = "0.9"
jpeg-decoder = { version = "0.3", default-features = false }
num-bigint = "0.5"
png = "0.18"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std", "tracing-log"] }
cindral-assets = { path = "crates/cindral-assets", version = "0.6.1" }
cindral-core = { path = "crates/cindral-core", version = "0.6.1" }
cindral-model = { path = "crates/cindral-model", version = "0.6.1" }
cindral-net = { path = "crates/cindral-net", version = "0.6.1" }
cindral-protocol = { path = "crates/cindral-protocol", version = "0.6.1" }
cindral-world = { path = "crates/cindral-world", version = "0.6.1" }
cindral-mesh = { path = "crates/cindral-mesh", version = "0.6.1" }
cindral-render = { path = "crates/cindral-render", version = "0.6.1" }
cindral-game = { path = "crates/cindral-game", version = "0.6.1" }
cindral-ui = { path = "crates/cindral-ui", version = "0.6.1" }
cindral-audio = { path = "crates/cindral-audio", version = "0.6.1" }
cindral-auth = { path = "crates/cindral-auth", version = "0.6.1" }
cindral-builtin-mods = { path = "crates/cindral-builtin-mods", version = "0.6.1" }
cindral-packext = { path = "crates/cindral-packext", version = "0.6.1" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The build to hand out: `cargo build --profile dist`. Fat LTO with one codegen unit
# makes the CPU-bound scene about 6 to 8 % faster and
# strips debug symbols for minimal distribution size.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
