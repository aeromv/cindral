[package]
name = "cindral-client"
description = "Cindral graphical client: network streaming, world building, meshing, wgpu window, and offscreen screenshots."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
cindral-packext.workspace = true
base64 = "0.23"
crossbeam-channel.workspace = true
glam = "0.34"
png.workspace = true
toml.workspace = true
jpeg-decoder.workspace = true
pollster = "1"
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
sha2 = "0.11"
thiserror.workspace = true
tokio.workspace = true
webbrowser = "1.2"
tracing.workspace = true
tracing-subscriber.workspace = true
cindral-assets.workspace = true
cindral-auth.workspace = true
cindral-audio.workspace = true
cindral-builtin-mods.workspace = true
cindral-core.workspace = true
cindral-game.workspace = true
cindral-mesh.workspace = true
cindral-model.workspace = true
cindral-net.workspace = true
cindral-protocol.workspace = true
cindral-render.workspace = true
cindral-ui.workspace = true
cindral-world.workspace = true
# `wayland-data-control`: without it Linux only gets the X11 backend, and a copy made on
# Wayland is not seen by Wayland-native applications.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
wgpu = "30.0.1"
winit = "0.30.8"
discord-rich-presence = "1.1.0"

# Only the Windows and macOS branch of `process_memory::read` uses it; Linux reads `/proc`.
[target.'cfg(not(target_os = "linux"))'.dependencies]
memory-stats = "1.2.0"

[target.'cfg(windows)'.dependencies]
# timeBeginPeriod: a 1 ms timer for the game thread's tick (timer_resolution.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
# The icon of cindral.exe in Explorer, the taskbar and shortcuts.
embed-resource = "3.0"

[dev-dependencies]
criterion = "0.8"
toml.workspace = true

[[bench]]
name = "client_hotpaths"
harness = false

[[bin]]
name = "cindral"
path = "src/main.rs"

[features]
# Forwards to `cindral-core/profiling`: puffin CPU spans.
profiling = ["cindral-core/profiling"]

[lints]
workspace = true
